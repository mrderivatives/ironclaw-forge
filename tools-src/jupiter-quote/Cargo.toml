[package]
name = "jupiter-quote"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.41.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
