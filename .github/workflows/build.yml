name: Build IronClaw Docker Image

on:
  workflow_dispatch:
    inputs:
      ironclaw_ref:
        description: 'IronClaw git ref (tag, branch, or commit SHA)'
        default: 'main'
        required: true
      image_tag:
        description: 'Docker image tag (e.g. latest, v0.18.0)'
        default: 'latest'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout ironclaw-forge
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            IRONCLAW_REF=${{ inputs.ironclaw_ref }}
          tags: |
            ghcr.io/mrderivatives/ironclaw-forge:${{ inputs.image_tag }}
            ghcr.io/mrderivatives/ironclaw-forge:${{ inputs.ironclaw_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ Built ghcr.io/mrderivatives/ironclaw-forge:${{ inputs.image_tag }}"
          echo "IronClaw ref: ${{ inputs.ironclaw_ref }}"
          echo "Platform: linux/amd64"
          echo "Includes: forge-init entrypoint (identity seeding + wallet awareness)"
